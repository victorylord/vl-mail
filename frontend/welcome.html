<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome – VL Mail</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" style="text-align:center;">
            <div style="font-size:64px; margin-bottom:16px;">🎉</div>
            <div class="auth-logo">
                <span class="logo-text">VL MAIL</span>
            </div>
            <h2 style="font-size:32px;">Welcome to VL Mail!</h2>
            <p class="auth-subtitle" style="font-size:18px;">
                Your account has been verified successfully.
            </p>
            <p style="color: var(--text-muted); margin-bottom:24px;">
                You can now use <strong id="userEmail" style="color: var(--gold);"></strong>
                to sign in anywhere on VL Mail.
            </p>

            <a href="dashboard.html" class="btn-gold" style="text-decoration:none; display:inline-block; padding:14px 40px;">
                Go to Inbox →
            </a>

            <p style="margin-top:24px; color: var(--text-muted); font-size:13px;">
                Your Privacy Choices
            </p>
        </div>
    </div>
    <script src="js/welcome.js"></script>
</body>
</html>

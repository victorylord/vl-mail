<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-adsense-account" content="ca-pub-7811708870335326">
    <title>Sign Up – VL Mail</title>
    <link rel="stylesheet" href="css/style.css" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7811708870335326" crossorigin="anonymous"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="logo-text">VL MAIL</span>
                <p>Premium Email. Built for Developers.</p>
            </div>
            <h2>Create Your Account</h2>
            <p class="auth-subtitle">Join VL Mail and get 30 free emails daily</p>

            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Victory Lord" required />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="victory@vlmail.com" required />
                    <span id="emailStatus" class="status-message"></span>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create a strong password" required />
                </div>

                <div class="terms-group">
                    <input type="checkbox" id="termsCheck" required />
                    <label for="termsCheck">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                </div>

                <button type="submit" class="btn-gold" id="registerBtn" disabled style="width:100%;">Create Account</button>
            </form>

            <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </div>
    <script src="js/register.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In – VL Mail</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="logo-text">VL MAIL</span>
                <p>Welcome Back</p>
            </div>
            <h2>Log In</h2>
            <p class="auth-subtitle">Access your VL Mail account</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="victory@vlmail.com" required />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn-gold" style="width:100%;">Log In</button>
            </form>
            <p class="auth-footer">
                Don't have an account? <a href="register.html">Sign up free</a>
            </p>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter Code – VL Mail</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="logo-text">VL MAIL</span>
                <p>Enter the verification code</p>
            </div>
            <h2>Verification Code</h2>
            <p class="auth-subtitle">We sent a 6-digit code to your Telegram</p>

            <form id="otpForm">
                <div class="form-group">
                    <label>6-digit Code</label>
                    <input type="text" id="otpCode" placeholder="1 2 3 4 5 6" maxlength="6" required />
                </div>

                <button type="submit" class="btn-gold" style="width:100%;">Verify →</button>
            </form>

            <p class="auth-footer">
                <a href="telegram-verify.html">Resend code</a>
            </p>
        </div>
    </div>
    <script src="js/otp-verify.js"></script>
</body>
</html>
